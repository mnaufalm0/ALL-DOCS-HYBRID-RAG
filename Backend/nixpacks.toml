[phases.setup]
nixPkgs = ["tesseract", "libtesseract"]

[phases.build]
cmds = [
  "python -m venv /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt",
  "python -c \"import nltk; nltk.download('punkt', quiet=True); nltk.download('punkt_tab', quiet=True); nltk.download('stopwords', quiet=True)\""
]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port ${PORT}"